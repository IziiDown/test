<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ma page simple</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 40px;
        background: #f4f4f4;
        color: #333;
      }

      h1 {
        color: #222;
      }

      .box {
        background: white;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>Bonjour !</h1>
      <p>Ceci est une page HTML très simple.</p>
      <button>Cliquez ici</button>
    </div>
  </body>
</html>
