<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Un petit bonjour</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="box">
      <p class="eyebrow">PETIT PROJET, GRAND DÉPART</p>
      <h1>Bonjour !</h1>
      <p class="intro">Une page toute simple, avec une petite surprise.</p>
      <button id="surprise-button" type="button">Voir la surprise</button>
      <button id="theme-button" class="theme-button" type="button" aria-pressed="false">
        Activer le mode nuit
      </button>
      <p id="surprise" class="surprise" aria-live="polite" hidden>
        Tu viens de faire le premier pas. À toi la suite !
      </p>
      <section class="counter" aria-label="Compteur de clics">
        <p>Clics comptés : <strong id="count">0</strong></p>
        <button id="count-button" type="button" aria-label="Ajouter un clic">+1</button>
      </section>
    </main>
    <script>
      const button = document.querySelector("#surprise-button");
      const surprise = document.querySelector("#surprise");
      const themeButton = document.querySelector("#theme-button");
      const countButton = document.querySelector("#count-button");
      const countDisplay = document.querySelector("#count");
      let count = 0;

      button.addEventListener("click", () => {
        surprise.hidden = !surprise.hidden;
        button.textContent = surprise.hidden ? "Voir la surprise" : "Cacher la surprise";
      });

      themeButton.addEventListener("click", () => {
        const nightMode = document.body.classList.toggle("night-mode");
        themeButton.setAttribute("aria-pressed", nightMode);
        themeButton.textContent = nightMode ? "Désactiver le mode nuit" : "Activer le mode nuit";
      });

      countButton.addEventListener("click", () => {
        count += 1;
        countDisplay.textContent = count;
      });
    </script>
  </body>
</html>
